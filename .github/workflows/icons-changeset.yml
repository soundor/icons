name: Icons changeset

# Dependabot updates the upstream icon sources (lucide-static, @tabler/icons,
# @phosphor-icons/core, heroicons); this workflow adds the changeset that
# releases the result, so merging the pull request is enough.
#
# It generates the icons at the base and at the pull request's head, and turns
# the difference into a bump and a description (packages/icons/scripts/
# changeset.ts): major for removed or renamed icons, minor for added ones,
# patch for any other change, no changeset when no icon changed. It commits
# .changeset/icons-<number>.md to the Dependabot branch.
#
# The push uses the workflow's own token, so GitHub does not start the checks
# on the new commit: re-run Verify on it before merging. `[dependabot skip]`
# keeps Dependabot rebasing the pull request.

on:
  pull_request:
    branches: [main]
    # Where the sources' versions are pinned.
    paths: [pnpm-workspace.yaml]

concurrency:
  group: icons-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset:
    name: Changeset
    # Dependabot's own branches only: they hold no code of a contributor.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit the changeset to the Dependabot branch
    steps:
      # The base first: the icons the pull request is compared to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm generate
      # The head replaces the tracked files; the base's generated icons are
      # untracked, so the generator compares against them.
      - name: Check out the Dependabot branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout -B "$BRANCH" "$HEAD_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soundor/icons generate --report "$RUNNER_TEMP/report.json"
      - id: changeset
        run: node packages/icons/scripts/changeset.ts "$RUNNER_TEMP/report.json" >> "$GITHUB_OUTPUT"
      - name: Commit the changeset
        env:
          BUMP: ${{ steps.changeset.outputs.bump }}
          BODY: ${{ steps.changeset.outputs.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          file=".changeset/icons-${PR}.md"
          if [[ "$BUMP" == none ]]; then
            rm -f "$file"
          else
            printf -- "---\n'@soundor/icons': %s\n---\n\n%s\n" "$BUMP" "$BODY" > "$file"
          fi
          git add --all .changeset
          if git diff --cached --quiet; then
            echo "The changeset is up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'chore: add a changeset for the icons update [dependabot skip]'
          git push origin "HEAD:refs/heads/${BRANCH}"
