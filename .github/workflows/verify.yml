name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The website's end-to-end tests run in Chromium.
      - run: pnpm --filter @soundor/icons-website exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Pack, and report the package's size
        run: |
          pnpm --filter @soundor/icons pack --pack-destination "$RUNNER_TEMP"
          ls -l "$RUNNER_TEMP"/*.tgz >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Soundor integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: 'true'
      # A plugin built with the Soundor CLI (`soundor build web`): its UI
      # bundle must hold the Soundor implementation of the imported icons only.
      - run: pnpm test:integration

  generated:
    name: Generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/icons/.cache
          key: upstream-${{ hashFiles('packages/icons/scripts/sources/material.ts') }}
      # The committed icons are what the pinned upstream sources generate.
      - run: pnpm generate --check
