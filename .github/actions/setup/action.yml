name: Set up Node and pnpm
description: Install the locked workspace dependencies

inputs:
  rust:
    description: Install Rust with the wasm32 target, for tests/soundor-consumer
    required: false
    default: 'false'
  cache:
    description: Whether to cache the pnpm store and the upstream icon sources
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    # A Soundor plugin's Rust library compiles to WebAssembly for the web
    # runtime: only the Soundor integration test builds one.
    - if: ${{ inputs.rust == 'true' }}
      shell: bash
      run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
    - shell: bash
      run: corepack enable && corepack install
    - id: store
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    # The Material Symbols files the generator fetches from Git at a pinned
    # commit (packages/icons/scripts/sources/material.ts). Without the cache,
    # the build fetches them, in about 20 seconds.
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: packages/icons/.cache
        key: upstream-${{ hashFiles('packages/icons/scripts/sources/material.ts') }}
    - shell: bash
      run: pnpm install --frozen-lockfile
