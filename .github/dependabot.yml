version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # The tested Soundor release is the package's compatibility target:
      # move it by hand, together with the peer range and a changeset.
      - dependency-name: '@soundor/*'
      - dependency-name: 'vitest-environment-soundor'
      # Node's types follow the Node version in .nvmrc: a new major moves with
      # it, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # The upstream icon sources, in one pull request of their own: the
      # "Icons changeset" workflow adds its changeset. Listed first, so a
      # source never lands in the groups below.
      icons:
        patterns:
          - 'lucide-static'
          - '@tabler/icons'
          - '@phosphor-icons/core'
          - 'heroicons'
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch
      pnpm-major:
        update-types:
          - major
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    # The composite action under .github/actions pins actions too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci(deps)'
